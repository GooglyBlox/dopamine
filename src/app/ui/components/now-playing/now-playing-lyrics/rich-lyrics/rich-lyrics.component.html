<div #liveContainer class="live-lyrics">
    <div class="live-lyrics__list">
        <div
            #liveLine
            *ngFor="let line of this.lines; let i = index; trackBy: this.trackByIndex"
            [ngClass]="this.lineClasses(i)"
            (click)="this.seekTo(i)"
        >
            {{ line.text }}
        </div>
    </div>
</div>
